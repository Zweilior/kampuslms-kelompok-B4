; Supervisor menjaga dua proses di dalam satu container:
;   1. apache  : melayani web
;   2. worker  : memproses antrean (notifikasi tersimpan di tabel `jobs`)
; Kalau salah satu mati, Supervisor menyalakannya lagi.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; Tiga bagian di bawah ini yang membuat `supervisorctl status` bisa dijalankan.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:apache]
command=apache2-foreground
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
priority=20
user=www-data
autostart=true
autorestart=true
numprocs=1
; Beri waktu job yang sedang berjalan untuk selesai sebelum dimatikan paksa.
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
