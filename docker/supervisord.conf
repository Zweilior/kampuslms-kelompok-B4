; =============================================================================
; Supervisor KampusLMS
; Menjaga dua proses utama dalam container Railway:
;   1. Web server Laravel
;   2. Queue worker Laravel
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid


; =============================================================================
; Socket agar supervisorctl status dapat digunakan di dalam container
; =============================================================================

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock


; =============================================================================
; Web server
; Railway menyediakan PORT melalui environment variable.
; =============================================================================

[program:web]
command=/bin/sh -c "php -S 0.0.0.0:${PORT:-8080} -t public"
directory=/var/www/html
priority=10
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; =============================================================================
; Laravel Queue Worker
; Memproses job dari QUEUE_CONNECTION=database.
; =============================================================================

[program:worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
priority=20
stopasgroup=true
killasgroup=true
autostart=true
autorestart=true
startsecs=1
numprocs=1
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0