; Batas unggah PHP untuk produksi.
; Harus >= validasi aplikasi: materi dosen 20 MB (MaterialController),
; submission API 5 MB. Kalau batas PHP lebih kecil, berkas ditolak server
; sebelum Laravel sempat memvalidasi, dan pesan errornya membingungkan.
; post_max_size sengaja lebih besar dari upload_max_filesize karena body
; multipart memuat field lain selain berkasnya.
upload_max_filesize = 20M
post_max_size = 25M
